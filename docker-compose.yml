services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentsync
      POSTGRES_PASSWORD: agentsync
      POSTGRES_DB: agentsync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsync -d agentsync"]
      interval: 2s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        CLI_VERSION: ${CLI_VERSION:-dev}
    environment:
      PORT: "8080"
      WEB_ORIGIN: https://zwarder.ru
      DATABASE_URL: postgres://agentsync:agentsync@db:5432/agentsync?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
  angie:
    build:
      context: ./deploy/angie
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - angie-acme:/var/lib/angie/acme
    depends_on:
      - web
      - api

volumes:
  angie-acme:
