services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentsync
      POSTGRES_PASSWORD: agentsync
      POSTGRES_DB: agentsync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsync -d agentsync"]
      interval: 2s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://agentsync:agentsync@db:5432/agentsync?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8080
    depends_on:
      - api
