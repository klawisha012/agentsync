services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agentsync}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        CLI_VERSION: ${CLI_VERSION:-dev}
    environment:
      PORT: "8080"
      WEB_ORIGIN: https://zwarder.ru
      DATABASE_URL: postgres://${POSTGRES_USER:-agentsync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agentsync}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
  angie:
    build:
      context: ./deploy/angie
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - angie-acme:/var/lib/angie/acme
    depends_on:
      - web
      - api

volumes:
  angie-acme:
