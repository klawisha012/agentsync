resolver 127.0.0.11 ipv6=off valid=10s;

acme_client le https://acme-v02.api.letsencrypt.org/directory retry_after_error=1h;

server {
    listen 80;
    listen 443 ssl;
    server_name zwarder.ru localhost;

    acme le;
    ssl_certificate $acme_cert_le;
    ssl_certificate_key $acme_cert_key_le;

    set $door_redirect "";
    if ($scheme = http) {
        set $door_redirect http;
    }
    if ($uri ~ ^/.well-known/acme-challenge/) {
        set $door_redirect "";
    }
    if ($door_redirect = http) {
        return 301 https://zwarder.ru$request_uri;
    }

    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ {
        set $api_backend api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
    }

    location / {
        set $web_backend web:3000;
        proxy_pass http://$web_backend;
    }
}
